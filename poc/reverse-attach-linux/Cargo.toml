[package]
name = "reverse-attach"
# Not the release version: releases compile in OAB_RELEASE_VERSION from the tag (#74).
version = "0.4.0"
edition = "2021"

[dependencies]
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# The crypto provider tungstenite's rustls needs for wss:// (#66). Without a provider
# feature, rustls cannot build a ClientConfig and the dial thread panics.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
