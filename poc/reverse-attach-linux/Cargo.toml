[package]
name = "reverse-attach"
# Not the release version: releases compile in OAB_RELEASE_VERSION from the tag (#74).
version = "0.4.0"
edition = "2021"

[dependencies]
# `screenshot` JPEG: grim writes raw PPM, this encodes it (pure Rust, no deps).
jpeg-encoder = "0.7"
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
