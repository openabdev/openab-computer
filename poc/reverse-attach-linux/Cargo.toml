[package]
name = "oab-computer"
# Matches the app release version. Releases still compile in OAB_RELEASE_VERSION from the tag (#74).
version = "0.12.0"
edition = "2021"

[dependencies]
# `screenshot` JPEG: grim writes raw PPM, this encodes it (pure Rust, no deps).
jpeg-encoder = "0.7"
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# The crypto provider tungstenite's rustls needs for wss:// (#66). Without a provider
# feature, rustls cannot build a ClientConfig and the dial thread panics.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# L1a (ADR linux-browser-tier D3 / OQ3 option 1): the audited crates the managed Playwright tier needs.
# sha256 while streaming; shares digest 0.10 with tungstenite's sha1.
sha2 = "0.10"
# gzip and raw deflate on the pure-Rust miniz_oxide backend; also provides the CRC-32 for zip entries.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# openat/mkdirat/symlinkat/renameat2/flock under a directory fd; `process` for geteuid (directory
# ownership checks), kill, waitid and PR_SET_PDEATHSIG for the installer's child processes (L1b);
# L2 adds pidfd_open and pidfd_send_signal (process) and the self-pipe of the signal handler (pipe).
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "pipe"] }
# Synchronous HTTPS client on the same rustls ring provider. No proxy, cookie, gzip or json features.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# The system root store for the https mint (#140). Already in the tree through tungstenite's
# rustls-tls-native-roots, same locked version, so no new code in the binary.
rustls-native-certs = "0.7"
