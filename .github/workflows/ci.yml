name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Fork-PR risk assessment (B11): fork PRs run with a read-only
    # GITHUB_TOKEN (enforced by `permissions:` below), this workflow uses
    # no secrets, and runners are ephemeral — so building/running a
    # PR-supplied Dockerfile is contained to the throwaway runner.
    # pull_request_target is deliberately NOT used (it would grant
    # PR-controlled code a privileged token — the more dangerous pattern).

# Least privilege: read-only token for every job (B11 security review).
permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: |
            docs/**/*.md

  swift:
    name: Swift build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Packaging smoke (unsigned; release signing is tag-only)
        run: scripts/test-packaging.sh .build/debug/oab-instance-mcp
      - name: Test
        run: swift test

  toolchain-image:
    name: Toolchain image smoke test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        # --pull: always fetch the base image from the registry so a stale
        # runner cache can't mask upstream changes (digest-pinned anyway).
        run: docker build --pull -t oab-toolchain images/toolchain
      - name: Smoke test
        run: |
          docker run --rm oab-toolchain bash -lc '
            python3 --version && node --version && git --version &&
            gh --version && jq --version && rg --version &&
            test "$(id -u)" = "1000" && echo non-root-ok &&
            test -w /var/log/oab-jobs && echo jobs-dir-ok'

  linux-installer:
    name: Linux installer units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ShellCheck
        run: shellcheck scripts/install-linux.sh scripts/test-install-linux.sh
      - name: Generated units (fake HOME, stubbed systemctl/tailscale/loginctl)
        # Diffs each written unit against its expected text and runs systemd-analyze verify (#90).
        run: bash scripts/test-install-linux.sh

  linux-hands-node:
    name: Linux hands node (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: poc/reverse-attach-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc/reverse-attach-linux
      - name: Release version from main.swift
        # Build the way release.yml does: OAB_RELEASE_VERSION is compiled into the binary and
        # smoke.sh fails unless sys_info reports it (#74). Job-wide, so every cargo step
        # shares one build. Same parser as the release gate (scripts/release-version.sh).
        run: |
          set -euo pipefail
          V=$(../../scripts/release-version.sh)
          echo "OAB_RELEASE_VERSION=$V" >> "$GITHUB_ENV"
          echo "EXPECT_AGENT_VERSION=$V" >> "$GITHUB_ENV"
      - name: Release gate rejects inexact tags
        # release.yml's gate is exact string equality, not a pattern match (#74).
        run: |
          set -euo pipefail
          G=../../scripts/release-version.sh
          V=$OAB_RELEASE_VERSION
          # `! cmd` alone is exempt from set -e, hence the explicit exits.
          rejects() { if "$@" 2>/dev/null; then echo "accepted: $*" >&2; exit 1; fi; }
          [ "$($G "v$V")" = "$V" ]
          rejects $G "v$V-beta"
          rejects $G "v${V//./x}"
          T=$(mktemp)
          echo "let version = \"$V-beta\"" > "$T"
          RELEASE_VERSION_SOURCE=$T rejects $G "v$V"
          printf 'let version = "%s"\nlet version = "%s"\n' "$V" "$V" > "$T"
          RELEASE_VERSION_SOURCE=$T rejects $G "v$V"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Unit + conformance tests
        # Includes conformance/*.json, shared with the Swift test target (oracle).
        run: cargo test --release
      - name: Smoke (mock runtime, loopback)
        # Exercises /attach, mint, disposition, MCP dispatch and bash; the
        # screenshot/mouse/key tools are listed but not invoked (no seat here).
        run: bash smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-attach-linux-${{ matrix.arch }}
          path: poc/reverse-attach-linux/target/release/reverse-attach
      - name: Smoke a plain build (reports -dev)
        # After the upload: rebuilds only this crate without OAB_RELEASE_VERSION, so smoke.sh
        # checks the "<crate>-dev" fallback a local build reports (#74). The first smoke run
        # leaves `sleep 30` orphans from its later attaches; wait them out (bounded), or this
        # run's "no sleep leaked" check sees them.
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do pgrep -f 'slee[p] 30' >/dev/null || break; sleep 1; done
          env -u OAB_RELEASE_VERSION -u EXPECT_AGENT_VERSION bash -c 'cargo build --release && bash smoke.sh'
